[package]
name = "arka-factory"
description = "Factory contract for deploying Arka instances"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
arka-registry = { path = "../arka-registry" }
arka = { path = "../arka", features = ["testutils"] }
share-token = { path = "../share-token", features = ["testutils"] }
adapter-blend = { path = "../adapter-blend" }
blend-router-mock = { path = "../blend-router-mock" }
serde_json = "1"

[features]
default = []
testutils = ["soroban-sdk/testutils"]



